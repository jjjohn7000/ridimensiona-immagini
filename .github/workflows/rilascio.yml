# Crea RidimensionaImmagini.exe su Windows e pubblica la versione su GitHub.
# Si avvia da solo quando su "main" arriva il programma con un numero di versione (APP_VERSION)
# non ancora pubblicato; se la versione esiste già non fa nulla.
# Si può avviare anche a mano dalla scheda "Actions".
name: Crea e pubblica la versione

on:
  push:
    branches: [main]
    paths: ["RidimensionaImmagini.py", ".github/workflows/rilascio.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Legge il numero di versione del programma
        id: ver
        shell: python
        run: |
          import os, re
          src = open("RidimensionaImmagini.py", encoding="utf-8").read()
          ver = re.search(r'^APP_VERSION = "([^"]+)"', src, re.M).group(1).strip()
          tag = "v" + re.sub(r"\s+", "-", ver)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={ver}\ntag={tag}\n")
          print("Versione", ver, "- etichetta", tag)

      - name: Controlla se questa versione è già pubblicata
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "nuova=no" >> "$GITHUB_OUTPUT"
            echo "La versione ${{ steps.ver.outputs.tag }} è già pubblicata: nulla da fare."
          else
            echo "nuova=si" >> "$GITHUB_OUTPUT"
            echo "Nuova versione da pubblicare: ${{ steps.ver.outputs.tag }}"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.nuova == 'si'
        with:
          python-version: "3.12"

      - name: Installa i componenti
        if: steps.check.outputs.nuova == 'si'
        run: |
          python -m pip install --upgrade pip pillow pillow-heif tkinterdnd2 pyinstaller
          # PyMuPDF senza le librerie aggiuntive che il programma non usa
          python -m pip install --upgrade --no-deps pymupdf

      - name: Crea l'eseguibile
        if: steps.check.outputs.nuova == 'si'
        run: |
          python crea_version_info.py
          python -m PyInstaller --noconfirm --clean RidimensionaImmagini.spec

      - name: Prova automatica dell'eseguibile (immagini, formati, PDF)
        if: steps.check.outputs.nuova == 'si'
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item dist\RidimensionaImmagini.exe).Length / 1MB, 1)
          Write-Host "Dimensione dell'eseguibile: $mb MB"
          $log = Join-Path $PWD "prova_automatica.txt"
          $p = Start-Process dist\RidimensionaImmagini.exe -ArgumentList "--autotest", "`"$log`"" -PassThru -Wait
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "La prova automatica non è riuscita" }

      - name: Prova di avvio dell'eseguibile
        if: steps.check.outputs.nuova == 'si'
        shell: pwsh
        run: |
          $p = Start-Process dist\RidimensionaImmagini.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "L'eseguibile si è chiuso subito (codice $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "L'eseguibile si avvia correttamente"

      - name: Impronta SHA-256 e note della versione
        if: steps.check.outputs.nuova == 'si'
        shell: python
        run: |
          import hashlib, re
          exe = "dist/RidimensionaImmagini.exe"
          digest = hashlib.sha256(open(exe, "rb").read()).hexdigest()
          open(exe + ".sha256", "w").write(digest + "  RidimensionaImmagini.exe\n")
          src = open("RidimensionaImmagini.py", encoding="utf-8").read()
          log = re.search(r'CHANGELOG = """(.*?)"""', src, re.S).group(1)
          section = re.split(r"(?m)^## ", log)[1]          # la versione più recente
          title, _, body = section.partition("\n")
          notes = "## Novità della versione " + title.strip() + "\n\n" + body.strip() + "\n"
          notes += "\n---\nScarica **RidimensionaImmagini.exe** qui sotto (sezione *Assets*) e avvialo: non serve installare nulla.\n"
          notes += "Chi ha già il programma riceve l'aggiornamento automaticamente all'avvio.\n"
          open("note_versione.md", "w", encoding="utf-8").write(notes)
          print(notes)

      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.nuova == 'si'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ridimensiona Immagini ${{ steps.ver.outputs.version }}
          body_path: note_versione.md
          files: |
            dist/RidimensionaImmagini.exe
            dist/RidimensionaImmagini.exe.sha256
